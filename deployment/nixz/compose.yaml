name: nixz
services:
  dnsdist:
    image: ${DNSDIST_IMAGE:-powerdns/dnsdist-20:2.0.10}
    network_mode: host
    user: "65532:65532"
    entrypoint: ["dnsdist"]
    command: ["--supervised", "--disable-syslog", "-C", "/config/dnsdist.conf"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes:
      - ${RELEASE_DIR:?Set RELEASE_DIR}:/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':14B4 ' /proc/net/udp && dnsdist --check-config -C /config/dnsdist.conf >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 384m
    cpus: 0.60
    pids_limit: 128
    ulimits:
      nofile: {soft: 8192, hard: 8192}
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
  nginx:
    image: ${NGINX_IMAGE:-nginx:1.30.5-alpine}
    network_mode: host
    user: "0:0"
    entrypoint: ["nginx"]
    command: ["-c", "/config/nginx.conf", "-g", "daemon off;"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes:
      - ${RELEASE_DIR:?Set RELEASE_DIR}:/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':01BB ' /proc/net/tcp && nginx -c /config/nginx.conf -t"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 192m
    cpus: 0.40
    pids_limit: 64
    ulimits:
      nofile: {soft: 8192, hard: 8192}
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
